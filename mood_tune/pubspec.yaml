name: mood_tune
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  cached_network_image: ^3.4.1
  camera: ^0.11.4
  cloud_firestore: ^6.1.2
  connectivity_plus: ^7.0.0
  dotted_border: ^3.1.0
  equatable: ^2.0.8
  firebase_auth: ^6.1.4
  firebase_core: ^4.4.0
  firebase_storage: ^13.0.6
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  formz: ^0.8.0
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  hive_flutter: ^1.1.0
  http: ^1.6.0
  image: ^4.8.0
  image_picker: ^1.2.1
  injectable: ^2.7.1+4
  json_annotation: ^4.11.0
  permission_handler: ^12.0.1
  tflite_flutter: ^0.12.1
  uuid: ^4.5.3
  youtube_player_flutter: ^9.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  injectable_generator: ^2.12.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Logo_cropped.png"

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#FFFFFF"
  image: "assets/images/Logo.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/Logo.png
    - assets/images/Logo_cropped.png
    - assets/images/Logo_transparent.png
